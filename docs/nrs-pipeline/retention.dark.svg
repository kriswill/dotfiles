<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="nebula's fourteen system generations, 155 to 168, as of 2026-10-24. Kept: 155, the previous successful boot; 161, the current boot; 167, the previous good switch; 168, the boot default and running system. The ten switched-only generations are deleted by the nightly prune but stay bootable from the GRUB menu, through its GC roots, until the next switch rewrites the menu.">
