<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Three darwin paths. nrs: set the profile, then the new generation's darwin-rebuild activate, which runs the full activation. nrt: env -i checkActivation=1 with the store bash running activate directly, which runs preActivation and system.checks and exits ok. darwin-rebuild check, shown struck out: it exports checkActivation=1 but the activate shebang's env -i wipes it, so it performs a full activation.">
