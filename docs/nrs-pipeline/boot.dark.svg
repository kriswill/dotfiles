<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" role="img" aria-label="The boot-step decision: unless --boot is given, nrs checks that the profile is this build, that grub.cfg can be read under sudo, that its first init= is this build, and that every listed init= still exists. If all hold, the bootloader is untouched; any no leads to setting the profile, switch-to-configuration boot, install-grub.pl writing grub.cfg, and grub-menu-roots rooting every listed system.">
