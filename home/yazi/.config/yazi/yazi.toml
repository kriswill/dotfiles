# Yazi settings — stow-managed (home/yazi/.config/yazi/yazi.toml), symlinked
# into ~ by modules/darwin/dotfiles-stow.nix. Edit live; no rebuild needed.
#
# Plugins are referenced here by bare name (e.g. `git`, `font-dark`,
# `faster-piper`); yazi resolves each to plugins/<name>.yazi. The third-party
# `git` plugin and the flavor are linked into ~/.config/yazi/{plugins,flavors}
# from the /nix/store by modules/darwin/yazi/default.nix during activation;
# `font-dark` and the vendored `faster-piper` fork (patched so interrupted
# renders can't cache blank previews) live in this stow tree under plugins/.

[mgr]
ratio = [1, 2, 3]

# The preset ships "Show EXIF" as a second *variant* of the `reveal` opener,
# and every preset rule includes `reveal` — so exiftool is offered on every
# file, including html/text where it reports nothing useful. Redefine `reveal`
# without that variant (a user `[opener]` key replaces the preset's entry of
# the same name wholesale; other preset openers are untouched) and hoist the
# exiftool call into its own `exif` opener, handed out per-rule below.
[opener]
reveal = [
  { run = "xdg-open %d1",         desc = "Reveal", for = "linux" },
  { run = "open -R %s1",          desc = "Reveal", for = "macos" },
  { run = "explorer /select,%s1", desc = "Reveal", for = "windows", orphan = true },
  { run = "termux-open %d1",      desc = "Reveal", for = "android" },
]
exif = [
  { run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
  { run = "exiftool %s1 & pause", desc = "Show EXIF", for = "windows", block = true },
]

# Open .html in the default browser. The preset `open` opener is already
# platform-dispatched (`open` on macOS, `xdg-open` on Linux, `start` on
# Windows), so reusing it keeps this portable. Without this rule html falls
# under the preset's `text/*` rule and defaults to $EDITOR.
[[open.prepend_rules]]
url = "*.html"
use = ["open", "edit", "reveal"]

# Re-grant EXIF only where metadata exists. These mirror the preset's image /
# media rules (first match wins, so prepending shadows them) plus the two font
# mimes the font previewer above already special-cases. First entry in `use` is
# what plain Enter fires; `exif` sits last, reachable from the `O` menu.
[[open.prepend_rules]]
mime = "image/*"
use = ["open", "reveal", "exif"]

[[open.prepend_rules]]
mime = "{audio,video}/*"
use = ["play", "reveal", "exif"]

[[open.prepend_rules]]
mime = "font/*"
use = ["open", "reveal", "exif"]

[[open.prepend_rules]]
mime = "application/ms-opentype"
use = ["open", "reveal", "exif"]

# Show git status in the file list, via the `git` plugin's fetcher.
[[plugin.prepend_fetchers]]
group = "git"
run = "git"
url = "*"

[[plugin.prepend_fetchers]]
group = "git"
run = "git"
url = "*/"

# Font previews are rendered by the *preloader* (it writes the cached image)
# and merely displayed by the previewer. Override both, else the built-in
# `font` preloader caches a white image first and `font-dark`'s peek
# short-circuits on the existing cache. Mirror the preset's two font mime rules.
[[plugin.prepend_preloaders]]
mime = "font/*"
run = "font-dark"

[[plugin.prepend_preloaders]]
mime = "application/ms-opentype"
run = "font-dark"

[[plugin.prepend_previewers]]
mime = "font/*"
run = "font-dark"

[[plugin.prepend_previewers]]
mime = "application/ms-opentype"
run = "font-dark"

# Markdown via glow (+ its kanagawa style, stow-managed under home/glow/),
# piped through faster-piper. glow and bat are on the system PATH.
[[plugin.prepend_previewers]]
run = 'faster-piper -- CLICOLOR_FORCE=1 glow -w=$w -s="/Users/k/Library/Preferences/glow/kanagawa-dragon.json" "$1"'
url = "*.md"

[[plugin.prepend_previewers]]
run = "bat"
url = "*.(py|sh|go|ts|css|yaml|yml|toml|html|conf|json|csv)"
