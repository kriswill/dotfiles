onboarding = false
[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
[keys]
prefix = "ctrl+space"
previous_tab = "shift+left"
next_tab = "shift+right"
previous_workspace = "shift+up"
next_workspace = "shift+down"
# tmux muscle memory: % splits side-by-side, " splits stacked
split_vertical = ["prefix+percent", "prefix+v"]
split_horizontal = ["prefix+double_quote", "prefix+minus"]
toggle_sidebar = "prefix+space"

# ctrl+h/j/k/l pane focus, but vim-aware: herdr-nav checks whether the focused
# pane is running vim/nvim and, if so, forwards the chord to it instead of
# moving pane focus — nvim walks its own splits and calls `herdr pane focus`
# once it's against the edge (home/nvim/.config/nvim/lua/config/multiplexer.lua).
# This is the herdr equivalent of tmux.conf's is_vim + if-shell binds.
# focus_pane_* stays on its prefix+h/j/k/l default as a direct fallback.
#
# Each command falls back to plain directional focus if herdr-nav is not on the
# PATH — this file is a stow symlink into the repo, so it takes effect the
# moment herdr restarts, while herdr-nav only lands after a system rebuild.
# Without the fallback that window leaves all four keys dead. The chain is safe
# because herdr-nav exits 0 on every path except a usage error, so `||` fires
# only for command-not-found (see pkgs/herdr-nav.sh). herdr runs these through
# `/bin/sh -lc`, and exports HERDR_BIN_PATH pointing at its own binary.

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "herdr-nav left || ${HERDR_BIN_PATH:-herdr} pane focus --direction left --current"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "herdr-nav down || ${HERDR_BIN_PATH:-herdr} pane focus --direction down --current"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "herdr-nav up || ${HERDR_BIN_PATH:-herdr} pane focus --direction up --current"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "herdr-nav right || ${HERDR_BIN_PATH:-herdr} pane focus --direction right --current"

[[keys.command]]
key = "prefix+r"
type = "shell"
command = "bun /Users/k/.config/herdr/scripts/pane-rotate.ts"

[ui.toast]
delivery = "herdr"

[theme]
name = "kanagawa"
auto_switch = false
