[ui]
agent_panel_sort = "priority"

[keys]
prefix = "ctrl+space"
previous_tab = "shift+left"
next_tab = "shift+right"
previous_workspace = "shift+up"
next_workspace = "shift+down"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
# tmux muscle memory: % splits side-by-side, " splits stacked
split_vertical = "prefix+percent"
split_horizontal = "prefix+double_quote"
toggle_sidebar = "prefix+space"
